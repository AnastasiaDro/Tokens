plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.kotlinAndroid)
    alias(libs.plugins.navigationSafeArgs)
    id 'kotlin-parcelize'
}

android {
    namespace 'com.cerebus.tokens'

    defaultConfig {
        applicationId "com.cerebus.tokens_new"
        minSdk 28
        targetSdk 36
        versionCode 8
        versionName "2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.androidxCardview

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidxAppcompat
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidxTestJunit
    androidTestImplementation libs.androidxTestEspresso

    implementation libs.androidxCoreKtx
    implementation libs.androidxLifecycleRuntimeKtx
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidxTestJunit
    androidTestImplementation libs.androidxTestEspresso

    implementation libs.androidxLifecycleLivedataKtx
    implementation libs.androidxLifecycleRuntimeKtx
    implementation libs.androidxLifecycleViewmodelKtx

    implementation libs.androidxActivityKtx
    implementation libs.androidxFragmentKtx

    implementation libs.viewbindingDelegate

    // color picker
    implementation libs.colorPicker

    // Lottie
    implementation libs.lottie

    //navigation
    implementation libs.navigationFragmentKtx
    implementation libs.navigationUiKtx
    // Dynamic Feature Module Support
    implementation libs.navigationDynamicFeaturesFragment

    // Testing Navigation
    androidTestImplementation libs.navigationTesting

    //Clean layers
    implementation project(path: ':feature:tokens_feature')
    implementation project(path: ':feature:reinforcement_photo')
    implementation project(path: ':core:logger')
    implementation project(path: ':data:reinforcement')

    //Koin
    implementation libs.koinCore
    implementation libs.koinAndroid
    implementation libs.koinTest

}
