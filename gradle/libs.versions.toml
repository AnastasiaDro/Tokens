[versions]
agp = "9.0.1"
kotlin = "2.2.10"
navigation = "2.9.6"
androidxCore = "1.17.0"
appcompat = "1.7.1"
material = "1.12.0"
constraintlayout = "2.1.4"
cardview = "1.0.0"
lifecycle = "2.6.1"
activity = "1.8.1"
fragment = "1.6.2"
viewbindingDelegate = "1.5.9"
colorPicker = "2.2.4"
lottie = "3.4.0"
koin = "3.5.0"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
composeBom = "2025.08.00"
coroutines = "1.9.0"
datastore = "1.2.1"
serialization = "1.9.0"

[libraries]
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
serializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidxCardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidxCoreKtx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidxAppcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidxLifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidxLifecycleViewmodelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidxActivityKtx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidxFragmentKtx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
navigationFragmentKtx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigationUiKtx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
navigationDynamicFeaturesFragment = { module = "androidx.navigation:navigation-dynamic-features-fragment", version.ref = "navigation" }
navigationTesting = { module = "androidx.navigation:navigation-testing", version.ref = "navigation" }
koinCore = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koinAndroid = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koinTest = { module = "io.insert-koin:koin-test", version.ref = "koin" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
colorPicker = { module = "com.github.skydoves:colorpickerview", version.ref = "colorPicker" }
viewbindingDelegate = { module = "com.github.kirich1409:viewbindingpropertydelegate-full", version.ref = "viewbindingDelegate" }
junit = { module = "junit:junit", version.ref = "junit" }
coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidxTestJunit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidxTestEspresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeUi = { module = "androidx.compose.ui:ui" }
composeFoundation = { module = "androidx.compose.foundation:foundation" }
composeUiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
kotlinParcelizeRuntime = { module = "org.jetbrains.kotlin:kotlin-parcelize-runtime", version.ref = "kotlin" }
kotlinParcelizeCompiler = { module = "org.jetbrains.kotlin:kotlin-parcelize-compiler", version.ref = "kotlin" }

[plugins]
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinParcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
navigationSafeArgs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
